<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_title }} — Edit tweet</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body data-server-auth="1" data-after-login="/home">
    <header class="top-bar">
        <div>
            <h1>{{ app_title }}</h1>
            <p class="sub">Edit tweet</p>
        </div>
        <nav class="nav-links">
            <a href="/home">Home</a>
            <button type="button" id="sign-out" class="btn btn-small">Sign out</button>
        </nav>
    </header>

    <main class="page narrow">
        {% if flash_message %}
        <p class="flash flash-{{ flash_kind }}">{{ flash_message }}</p>
        {% endif %}

        <section class="card">
            <form method="post" action="/edit-tweet">
                <input type="hidden" name="tweet_id" value="{{ tweet_id }}">
                <label for="tweet-text">Tweet text</label>
                <textarea id="tweet-text" name="text" rows="5" maxlength="{{ max_tweet_len }}" required>{{ tweet.text }}</textarea>
                <p class="hint">{{ max_tweet_len }} characters max.</p>
                <div class="btn-row">
                    <button type="submit" class="btn primary">Save</button>
                    <a class="btn" href="/home">Cancel</a>
                </div>
            </form>
        </section>
    </main>
    <script type="module" src="/static/firebase-login.js"></script>
</body>
</html>
