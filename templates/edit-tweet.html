<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_title }} - Edit tweet</title>
    <link rel="stylesheet" href="/static/style.css?v=gc-red-2">
</head>
<body class="app-body" data-server-auth="1" data-after-login="/home">
    <header class="top-bar app-header">
        <div>
            <p class="brand-mark">{{ app_title }}</p>
            <p class="sub">Edit tweet</p>
        </div>
        <nav class="nav-links">
            <a href="/home">Home</a>
            <a href="/search">Search</a>
            <button type="button" id="sign-out" class="btn btn-small">Sign out</button>
        </nav>
    </header>

    <main class="page narrow">
        {% if flash_message %}
        <p class="flash flash-{{ flash_kind }}">{{ flash_message }}</p>
        {% endif %}

        <section class="card">
            <form method="post" action="/edit-tweet" enctype="multipart/form-data">
                <input type="hidden" name="tweet_id" value="{{ tweet_id }}">
                <label for="tweet-text">Tweet text</label>
                <textarea id="tweet-text" name="text" rows="5" maxlength="{{ max_tweet_len }}" required>{{ tweet.text }}</textarea>
                <p class="hint">{{ max_tweet_len }} characters max.</p>

                {% if tweet.image_url %}
                <p class="hint">Current image:</p>
                <img class="tweet-img tweet-img-preview" src="{{ tweet.image_url }}" alt="">
                <label class="chk-label">
                    <input type="checkbox" name="remove_image" value="on"> Remove image
                </label>
                {% endif %}

                <label for="tweet-image">New image (JPG or PNG, optional)</label>
                <input id="tweet-image" name="tweet_image" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png">

                <div class="btn-row">
                    <button type="submit" class="btn primary">Save</button>
                    <a class="btn" href="/home">Cancel</a>
                </div>
            </form>
        </section>
    </main>
    <script type="module" src="/static/firebase-login.js"></script>
</body>
</html>
